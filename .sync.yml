# This file can be used to customize the files managed by PDK.
#
# See https://github.com/puppetlabs/pdk-templates/blob/main/README.md
# for more information.
#
# See https://github.com/puppetlabs/pdk-templates/blob/main/config_defaults.yml
# for the default values.
---
.rubocop.yml:
  default_configs:
    # rubocop 1.73.2 crashes inspecting the UTF-16 BOM binary-string literals
    # ("\xFF\xFE".b) in lib/puppet_x/gpno/backup_manifest.rb#parse_gpt_ini —
    # confirmed upstream cop bug, not a code issue (see PR/issue #6). Disable
    # until an unaffected rubocop release lands.
    HashInspect/LegacyHashInspectFormat:
      Enabled: false
    # Compact class/module syntax (class Foo::Bar::Baz) requires Foo and
    # Foo::Bar to already exist as constants — Ruby doesn't auto-vivify
    # intermediate namespaces the way nested module/module/class does. We
    # have no separate namespace-declaring file, so nested style is the only
    # safe option here.
    Style/ClassAndModuleChildren:
      EnforcedStyle: nested
